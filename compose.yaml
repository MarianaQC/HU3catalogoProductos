services:
  api:
    build:
      context: .     
      dockerfile: catalogoProductos.Api/Dockerfile
    container_name: catalogo_api
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=server=db;port=3306;database=catalogodb;user=root;password=1234;
      - ASPNETCORE_URLS=http://+:8080

  db:
    image: mysql:8.0
    container_name: catalogo_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: catalogodb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
